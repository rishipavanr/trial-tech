<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<link rel="stylesheet" href="css/style.css?v=2.6">
</head>
<body>

<div class="star-layer3"></div>
<div id="tt-loader"></div>

<!-- Round splash badge -->
<div class="round-splash" id="roundSplash">
  <div class="round-splash-inner">
    <span class="round-splash-icon">⚡</span>
    <div class="round-splash-title" style="color:var(--r4)">ROUND 4</div>
    <div class="round-splash-sub">Rapid Rush — Code. Think. Conquer.</div>
    <div class="round-splash-line" style="background:linear-gradient(90deg,transparent,var(--r4),transparent)"></div>
  </div>
</div>

<main class="wrap" id="main"></main>

<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/common.js"></script>
<script src="js/r4.js"></script>
<script>
(function () {
  setTimeout(function(){ var s=document.getElementById('roundSplash'); if(s) s.remove(); }, 2600);

  TT.boot(TT_DATA.brand.event + " — Round 4 — Rapid Rush");
  TT.r4.init();
})();
</script>
</body>
